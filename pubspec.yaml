name: bean_ai
description: "Bean.ai – Your AI Coffee Companion & Personal Barista"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.1.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Networking
  http: ^1.2.0
  dio: ^5.4.0
  url_launcher: ^6.2.5

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image_cropper: ^5.0.1

  # AI & ML
  google_mlkit_text_recognition: ^0.11.0
  google_mlkit_barcode_scanning: ^0.10.0
  google_mlkit_image_labeling: ^0.11.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.2
  flutter_rating_bar: ^4.0.1
  percent_indicator: ^4.2.3
  lottie: ^3.0.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # In-App Purchases
  in_app_purchase: ^3.1.13
  purchases_flutter: ^6.17.0

  # Firebase
  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4
  firebase_analytics: ^10.8.4
  cloud_firestore: ^4.15.4
  firebase_storage: ^11.6.4
  firebase_messaging: ^14.7.15

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Animations
  flutter_animate: ^4.5.0
  animations: ^2.0.11

  # Fonts & Icons
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: BeanDisplay
      fonts:
        - asset: assets/fonts/BeanDisplay-Regular.ttf
        - asset: assets/fonts/BeanDisplay-Bold.ttf
          weight: 700
