name: bean_ai
description: "Bean.ai – Your AI Coffee Companion & Personal Barista"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3

  # Networking
  http: ^1.2.2
  url_launcher: ^6.3.1

  # Camera & Image
  image_picker: ^1.1.2

  # UI Components
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  flutter_rating_bar: ^4.0.1
  flutter_animate: ^4.5.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
